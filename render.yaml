services:
  - type: web
    name: kick-vod-extractor
    runtime: docker
    plan: free
    dockerContext: ./extractor
    dockerfilePath: ./extractor/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: EXTRACTOR_TOKEN
        sync: false
      - key: MAX_DURATION_SECONDS
        value: "1800"
